<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Què és avaluar?" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Què és avaluar?</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2340" flood-opacity=".14"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6078"/></marker></defs>
<rect width="1000" height="760" rx="22" fill="#F6F4FD"/>
<text x="500.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="500.0" dy="0.0">Què és avaluar?</tspan></text><text x="500.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="500.0" dy="0.0">Recollir informació per a valorar l&#x27;aprenentatge, prendre decisions i millorar</tspan></text><circle cx="500" cy="420" r="170" fill="none" stroke="#DCD6F5" stroke-width="40"/><path d="M523.7 251.7 A170 170 0 0 1 668.3 396.3" stroke="#3B82F6" stroke-width="40" fill="none"/><path d="M668.3 396.3 l0 0" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar)"/><path d="M668.3 443.7 A170 170 0 0 1 523.7 588.3" stroke="#F2A93B" stroke-width="40" fill="none"/><path d="M523.7 588.3 l0 0" stroke="#F2A93B" stroke-width="2" marker-end="url(#ar)"/><path d="M476.3 588.3 A170 170 0 0 1 331.7 443.7" stroke="#E5645A" stroke-width="40" fill="none"/><path d="M331.7 443.7 l0 0" stroke="#E5645A" stroke-width="2" marker-end="url(#ar)"/><path d="M331.7 396.3 A170 170 0 0 1 476.3 251.7" stroke="#14A38B" stroke-width="40" fill="none"/><path d="M476.3 251.7 l0 0" stroke="#14A38B" stroke-width="2" marker-end="url(#ar)"/><circle cx="500" cy="248" r="34" fill="#fff" stroke="#3B82F6" stroke-width="5" filter="url(#sh)"/><g transform="translate(500,248) scale(0.62)"><circle cx="-6" cy="-6" r="18" fill="#fff" stroke="#3B82F6" stroke-width="5"/><line x1="7" y1="7" x2="24" y2="24" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/></g><rect x="370" y="144" width="260" height="68" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="500" y="170" font-size="17" font-weight="800" fill="#3B82F6" text-anchor="middle"><tspan x="500" dy="0.0">1. Recollir informació</tspan></text><text x="500" y="194" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="500" dy="0.0">Observar, corregir, preguntar</tspan></text><circle cx="672" cy="420" r="34" fill="#fff" stroke="#F2A93B" stroke-width="5" filter="url(#sh)"/><g transform="translate(672,420) scale(0.62)"><rect x="-28" y="-26" width="56" height="50" rx="5" fill="#fff" stroke="#F2A93B" stroke-width="2"/><polyline points="-20,14 -8,4 2,8 12,-6 22,-14" stroke="#F2A93B" stroke-width="4" fill="none"/><circle cx="-20" cy="14" r="3.5" fill="#F2A93B"/><circle cx="-8" cy="4" r="3.5" fill="#F2A93B"/><circle cx="2" cy="8" r="3.5" fill="#F2A93B"/><circle cx="12" cy="-6" r="3.5" fill="#F2A93B"/><circle cx="22" cy="-14" r="3.5" fill="#F2A93B"/></g><rect x="717" y="386" width="260" height="68" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="847" y="412" font-size="17" font-weight="800" fill="#F2A93B" text-anchor="middle"><tspan x="847" dy="0.0">2. Valorar</tspan></text><text x="847" y="436" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="847" dy="0.0">Comparar amb els criteris</tspan></text><circle cx="500" cy="592" r="34" fill="#fff" stroke="#E5645A" stroke-width="5" filter="url(#sh)"/><g transform="translate(500,592) scale(0.62)"><path d="M-14 -32 L-4 -8 M14 -32 L4 -8" stroke="#E5645A" stroke-width="8"/><circle cy="8" r="20" fill="#E5645A"/><circle cy="8" r="13" fill="none" stroke="#fff" stroke-width="3"/><path d="M0 0 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1z" fill="#fff"/></g><rect x="370" y="630" width="260" height="68" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="500" y="656" font-size="17" font-weight="800" fill="#E5645A" text-anchor="middle"><tspan x="500" dy="0.0">3. Decidir</tspan></text><text x="500" y="680" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="500" dy="0.0">Qualificar, reforçar, ampliar</tspan></text><circle cx="328" cy="420" r="34" fill="#fff" stroke="#14A38B" stroke-width="5" filter="url(#sh)"/><g transform="translate(328,420) scale(0.62)"><circle cx="0" cy="-8" r="20" fill="#14A38B"/><rect x="-9" y="12" width="18" height="12" rx="3" fill="#5B6078"/><path d="M-7 -8 L-2 2 L2 -6 L7 2" stroke="#fff" stroke-width="3" fill="none"/></g><rect x="23" y="386" width="260" height="68" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="153" y="412" font-size="17" font-weight="800" fill="#14A38B" text-anchor="middle"><tspan x="153" dy="0.0">4. Millorar</tspan></text><text x="153" y="436" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="153" dy="0.0">Retroalimentar i ajustar l&#x27;ensenyament</tspan></text><g transform="translate(470,460) scale(1.3)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#5B3FBF"/></g><g transform="translate(536,460) scale(1.1)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#14A38B"/></g><text x="500" y="360" font-size="17" font-weight="800" fill="#5B3FBF" text-anchor="middle"><tspan x="500" dy="0.0">Alumnat i docent</tspan></text>
</svg>
