<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="Els tres moments de l&#x27;avaluació" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Els tres moments de l&#x27;avaluació</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2340" flood-opacity=".14"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6078"/></marker></defs>
<rect width="1100" height="440" rx="22" fill="#F6F4FD"/>
<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">Els tres moments de l&#x27;avaluació</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">L&#x27;avaluació acompanya tot el curs, no només el final</tspan></text><line x1="120" y1="250" x2="990" y2="250" stroke="#5B6078" stroke-width="6" stroke-linecap="round" marker-end="url(#ar)"/><text x="1000" y="285" font-size="14" font-weight="700" fill="#5B6078" text-anchor="end"><tspan x="1000" dy="0.0">Curs escolar</tspan></text><circle cx="220" cy="250" r="46" fill="#fff" stroke="#3B82F6" stroke-width="6" filter="url(#sh)"/><g transform="translate(220,250) scale(0.8)"><circle cx="-6" cy="-6" r="18" fill="#fff" stroke="#3B82F6" stroke-width="5"/><line x1="7" y1="7" x2="24" y2="24" stroke="#3B82F6" stroke-width="7" stroke-linecap="round"/></g><text x="220" y="172" font-size="22" font-weight="800" fill="#3B82F6" text-anchor="middle"><tspan x="220" dy="0.0">Inicial</tspan></text><rect x="70" y="312" width="300" height="100" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="220" y="342" font-size="15" font-weight="700" fill="#1F2340" text-anchor="middle"><tspan x="220" dy="0.0">D&#x27;on partim?</tspan></text><text x="220" y="370" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="220" dy="0.0">Qüestionari, prova senzilla, enquesta</tspan></text><circle cx="550" cy="250" r="46" fill="#fff" stroke="#F2A93B" stroke-width="6" filter="url(#sh)"/><g transform="translate(550,250) scale(0.8)"><rect x="-28" y="-26" width="56" height="50" rx="5" fill="#fff" stroke="#F2A93B" stroke-width="2"/><polyline points="-20,14 -8,4 2,8 12,-6 22,-14" stroke="#F2A93B" stroke-width="4" fill="none"/><circle cx="-20" cy="14" r="3.5" fill="#F2A93B"/><circle cx="-8" cy="4" r="3.5" fill="#F2A93B"/><circle cx="2" cy="8" r="3.5" fill="#F2A93B"/><circle cx="12" cy="-6" r="3.5" fill="#F2A93B"/><circle cx="22" cy="-14" r="3.5" fill="#F2A93B"/></g><text x="550" y="172" font-size="22" font-weight="800" fill="#F2A93B" text-anchor="middle"><tspan x="550" dy="0.0">Contínua</tspan></text><rect x="400" y="312" width="300" height="100" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="550" y="342" font-size="15" font-weight="700" fill="#1F2340" text-anchor="middle"><tspan x="550" dy="0.0">Com anem?</tspan></text><text x="550" y="370" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550" dy="0.0">Pràctiques, observació, portafolis</tspan></text><circle cx="880" cy="250" r="46" fill="#fff" stroke="#E5645A" stroke-width="6" filter="url(#sh)"/><g transform="translate(880,250) scale(0.8)"><path d="M-14 -32 L-4 -8 M14 -32 L4 -8" stroke="#E5645A" stroke-width="8"/><circle cy="8" r="20" fill="#E5645A"/><circle cy="8" r="13" fill="none" stroke="#fff" stroke-width="3"/><path d="M0 0 l3 6 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1z" fill="#fff"/></g><text x="880" y="172" font-size="22" font-weight="800" fill="#E5645A" text-anchor="middle"><tspan x="880" dy="0.0">Final</tspan></text><rect x="730" y="312" width="300" height="100" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="880" y="342" font-size="15" font-weight="700" fill="#1F2340" text-anchor="middle"><tspan x="880" dy="0.0">Hi hem arribat?</tspan></text><text x="880" y="370" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="880" dy="0.0">Assoliment dels RA, qualificació</tspan></text>
</svg>
