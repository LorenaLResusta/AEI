<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">Alumnat amb necessitat específica de suport educatiu (NESE)</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">Les NEE són una part de les NESE (LOE, art. 71)</tspan></text><circle cx="550" cy="400" r="270" fill="#EDE9FB" stroke="#5B3FBF" stroke-width="3" stroke-dasharray="10 8"/><rect x="490" y="108" width="120" height="36" rx="18" fill="#5B3FBF"/><text x="550" y="133" font-size="18" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="550" dy="0.0">NESE</tspan></text><circle cx="550" cy="400" r="92" fill="#5B3FBF" filter="url(#sh)"/><text x="550" y="382" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="550" dy="0.0">NEE</tspan></text><text x="550" y="410" font-size="12.5" font-weight="400" fill="#E9E6FA" text-anchor="middle"><tspan x="550" dy="0.0">Discapacitat o trastorns</tspan><tspan x="550" dy="15.6">greus de conducta,</tspan><tspan x="550" dy="15.6">comunicació o llenguatge</tspan></text><circle cx="619" cy="228" r="62" fill="#14A38B" filter="url(#sh)"/><text x="619.3022197819437" y="225.47098690514431" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="619.3022197819437" dy="0.0">Altes</tspan><tspan x="619.3022197819437" dy="16.2">capacitats</tspan></text><circle cx="720" cy="328" r="62" fill="#F2A93B" filter="url(#sh)"/><text x="720.2933978887015" y="316.71474122948433" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="720.2933978887015" dy="0.0">Trastorns</tspan><tspan x="720.2933978887015" dy="16.2">d&#x27;atenció o</tspan><tspan x="720.2933978887015" dy="16.2">aprenentatge</tspan></text><circle cx="722" cy="469" r="62" fill="#E5645A" filter="url(#sh)"/><text x="721.5290130948557" y="466.30221978194373" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan 