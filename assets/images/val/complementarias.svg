<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">Activitats complementàries i extraescolars</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">Totes dues es programen en la PD i s&#x27;inclouen en la programació general anual (PGA)</tspan></text><rect x="50" y="110" width="480" height="500" rx="16" fill="#FFFFFF" filter="url(#sh)"/><rect x="50" y="110" width="480" height="84" rx="16" fill="#3B82F6"/><text x="290" y="145" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="290" dy="0.0">Complementàries</tspan></text><text x="290" y="174" font-size="13" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="290" dy="0.0">En horari lectiu · formen part del currículum · per a tot el grup</tspan></text><circle cx="110" cy="255" r="36" fill="#3B82F6" opacity=".12"/><g transform="translate(110,255) scale(0.78)"><rect x="-34" y="-22" width="68" height="38" rx="8" fill="#3B82F6"/><rect x="-28" y="-16" width="16" height="14" fill="#DDF3FF"/><rect x="-8" y="-16" width="16" height="14" fill="#DDF3FF"/><rect x="12" y="-16" width="16" height="14" fill="#DDF3FF"/><circle cx="-20" cy="18" r="7" fill="#1F2340"/><circle cx="20" cy="18" r="7" fill="#1F2340"/></g><text x="165" y="249" font-size="16" font-weight="800" fill="#1F2340" text-anchor="start"><tspan x="165" dy="0.0">Visita a una empresa o CPD</tspan></text><text x="165" y="271" font-size="12.5" font-weight="400" fill="#5B6078" text-anchor="start"><tspan x="165" dy="0.0">Veure en real el que es treballa a l&#x27;aula</tspan></text><circle cx="110" cy="351" r="36" fill="#3B82F6" opacity=".12"/><g transform="translate(110,351) scale(0.78)"><rect x="-9" y="-30" width="18" height="34" rx="9" fill="#3B82F6"/><path d="M-18 -4 a18 18 0 0 0 36 0" stroke="#1F2340" stroke-width="3" fill="none"/><line x1="0" y1="14" x2="0" y2="26" stroke="#1F2340" stroke-width="