<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="Les preguntes que respon una programació" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Les preguntes que respon una programació</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2340" flood-opacity=".14"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6078"/></marker></defs>
<rect width="1100" height="700" rx="22" fill="#F6F4FD"/>
<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">Les preguntes que respon una programació</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">Si la teua PD contesta aquestes cinc preguntes, està completa</tspan></text><line x1="200" y1="200" x2="550" y2="350" stroke="#E5645A" stroke-width="3" stroke-dasharray="6 6"/><line x1="900" y1="200" x2="550" y2="350" stroke="#F2A93B" stroke-width="3" stroke-dasharray="6 6"/><line x1="200" y1="500" x2="550" y2="350" stroke="#14A38B" stroke-width="3" stroke-dasharray="6 6"/><line x1="900" y1="500" x2="550" y2="350" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6"/><line x1="550" y1="470" x2="550" y2="608" stroke="#9B5DE5" stroke-width="3" stroke-dasharray="6 6"/><g filter="url(#sh)"><path d="M480 240 H600 L640 280 V470 H480Z" fill="#fff" stroke="#5B3FBF" stroke-width="3"/><path d="M600 240 V280 H640" fill="#EDE9FB" stroke="#5B3FBF" stroke-width="3"/></g><rect x="500" y="300" width="110" height="8" rx="4" fill="#C9C3E8"/><rect x="500" y="324" width="92" height="8" rx="4" fill="#C9C3E8"/><rect x="500" y="348" width="74" height="8" rx="4" fill="#C9C3E8"/><rect x="500" y="372" width="110" height="8" rx="4" fill="#C9C3E8"/><rect x="500" y="396" width="92" height="8" rx="4" fill="#C9C3E8"/><rect x="500" y="420" width="74" height="8" rx="4" fill="#C9C3E8"/><text x="560" y="455" font-size="22" font-weight="800" fill="#5B3FBF" text-anchor="middle"><tspan x="560" dy="0.0">PD</tspan></text><rect x="40" y="145" width="320" height="110" rx="16" fill="#FFFFFF" filter="url(#sh)"/><rect x="40" y="145" width="10" height="110" rx="5" fill="#E5645A"/><text x="205" y="185" font-size="21" font-weight="800" fill="#E5645A" text-anchor="middle"><tspan x="205" dy="0.0">Què ensenyar?</tspan></text><text x="205" y="218" font-size="15" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="205" dy="0.0">Objectius, RA, competències</tspan><tspan x="205" dy="18.8">i continguts</tspan></text><rect x="740" y="145" width="320" height="110" rx="16" fill="#FFFFFF" filter="url(#sh)"/><rect x="740" y="145" width="10" height="110" rx="5" fill="#F2A93B"/><text x="905" y="185" font-size="21" font-weight="800" fill="#F2A93B" text-anchor="middle"><tspan x="905" dy="0.0">Quan ensenyar?</tspan></text><text x="905" y="218" font-size="15" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="905" dy="0.0">Seqüenciació i temporització</tspan><tspan x="905" dy="18.8">de les unitats</tspan></text><rect x="40" y="445" width="320" height="110" rx="16" fill="#FFFFFF" filter="url(#sh)"/><rect x="40" y="445" width="10" height="110" rx="5" fill="#14A38B"/><text x="205" y="485" font-size="21" font-weight="800" fill="#14A38B" text-anchor="middle"><tspan x="205" dy="0.0">Com ensenyar?</tspan></text><text x="205" y="518" font-size="15" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="205" dy="0.0">Metodologia, activitats,</tspan><tspan x="205" dy="18.8">recursos i espais</tspan></text><rect x="740" y="445" width="320" height="110" rx="16" fill="#FFFFFF" filter="url(#sh)"/><rect x="740" y="445" width="10" height="110" rx="5" fill="#3B82F6"/><text x="905" y="485" font-size="17" font-weight="800" fill="#3B82F6" text-anchor="middle"><tspan x="905" dy="0.0">Què, com i quan avaluar?</tspan></text><text x="905" y="518" font-size="15" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="905" dy="0.0">Criteris, instruments,</tspan><tspan x="905" dy="18.8">qualificació i recuperació</tspan></text><rect x="320" y="608" width="460" height="52" rx="16" fill="#FFFFFF" filter="url(#sh)"/><rect x="320" y="608" width="10" height="52" rx="5" fill="#9B5DE5"/><text x="550" y="633" font-size="18" font-weight="800" fill="#9B5DE5" text-anchor="middle"><tspan x="550" dy="0.0">A qui?</tspan></text><text x="550" y="653" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550" dy="0.0">Context del centre, del grup i atenció a la diversitat</tspan></text>
</svg>
