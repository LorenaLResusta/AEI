<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Niveles de respuesta para la inclusión" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Niveles de respuesta para la inclusión</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2340" flood-opacity=".14"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6078"/></marker></defs>
<rect width="1100" height="560" rx="22" fill="#F6F4FD"/>
<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">Niveles de respuesta para la inclusión</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">Orden 20/2019 de la Comunitat Valenciana: de todo el centro a cada alumno o alumna</tspan></text><rect x="140" y="460" width="820" height="80" rx="12" fill="#14A38B" filter="url(#sh)"/><text x="180" y="510" font-size="30" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="180" dy="0.0">I</tspan></text><text x="570.0" y="494" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Toda la comunidad educativa</tspan></text><text x="570.0" y="518" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Planes de centro, accesibilidad, convivencia</tspan></text><rect x="225" y="368" width="650" height="80" rx="12" fill="#3B82F6" filter="url(#sh)"/><text x="265" y="418" font-size="30" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="265" dy="0.0">II</tspan></text><text x="570.0" y="402" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Grupo-clase</tspan></text><text x="570.0" y="426" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">DUA, metodologías activas, tutoría</tspan></text><rect x="310" y="276" width="480" height="80" rx="12" fill="#F2A93B" filter="url(#sh)"/><text x="350" y="326" font-size="30" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="350" dy="0.0">III</tspan></text><text x="570.0" y="310" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Respuesta diferenciada</tspan></text><text x="570.0" y="334" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Refuerzo, ampliación, acceso</tspan></text><rect x="395" y="184" width="310" height="80" rx="12" fill="#E5645A" filter="url(#sh)"/><text x="435" y="234" font-size="30" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="435" dy="0.0">IV</tspan></text><text x="570.0" y="218" font-size="16" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Respuesta especializada</tspan></text><text x="570.0" y="242" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="570.0" dy="0.0">Apoyos especializados</tspan></text><line x1="1010" y1="530" x2="1010" y2="190" stroke="#5B6078" stroke-width="4" marker-end="url(#ar)"/><text x="1030" y="360" font-size="13" font-weight="700" fill="#5B6078" text-anchor="start" writing-mode="tb"><tspan x="1030" dy="0.0">Más individual</tspan></text><g transform="translate(80,530) scale(1.0)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#5B3FBF"/></g><g transform="translate(60,540) scale(0.8)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#14A38B"/></g><g transform="translate(104,545) scale(0.75)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#F2A93B"/></g>
</svg>
