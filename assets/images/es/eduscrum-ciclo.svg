<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-label="eduScrum: el ciclo de un sprint" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>eduScrum: el ciclo de un sprint</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2340" flood-opacity=".14"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6078"/></marker></defs>
<rect width="1100" height="660" rx="22" fill="#F6F4FD"/>
<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">eduScrum: el ciclo de un sprint</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">El docente marca el qué; el equipo decide el cómo</tspan></text><rect x="40" y="140" width="220" height="400" rx="16" fill="#FFFFFF" filter="url(#sh)"/><text x="150" y="176" font-size="17" font-weight="800" fill="#5B3FBF" text-anchor="middle"><tspan x="150" dy="0.0">Pila de aprendizaje</tspan></text><rect x="58" y="196" width="184" height="44" rx="8" fill="#EDE9FB"/><text x="150" y="224" font-size="13" font-weight="600" fill="#1F2340" text-anchor="middle"><tspan x="150" dy="0.0">Objetivos y RA</tspan></text><rect x="58" y="252" width="184" height="44" rx="8" fill="#EDE9FB"/><text x="150" y="273" font-size="13" font-weight="600" fill="#1F2340" text-anchor="middle"><tspan x="150" dy="0.0">Criterios de</tspan><tspan x="150" dy="16.2">evaluación</tspan></text><rect x="58" y="308" width="184" height="44" rx="8" fill="#EDE9FB"/><text x="150" y="329" font-size="13" font-weight="600" fill="#1F2340" text-anchor="middle"><tspan x="150" dy="0.0">Definición de</tspan><tspan x="150" dy="16.2">terminado</tspan></text><rect x="58" y="364" width="184" height="44" rx="8" fill="#EDE9FB"/><text x="150" y="392" font-size="13" font-weight="600" fill="#1F2340" text-anchor="middle"><tspan x="150" dy="0.0">Retos de la unidad</tspan></text><rect x="58" y="420" width="184" height="44" rx="8" fill="#EDE9FB"/><text x="150" y="448" font-size="13" font-weight="600" fill="#1F2340" text-anchor="middle"><tspan x="150" dy="0.0">Entregables</tspan></text><text x="150" y="520" font-size="13" font-weight="700" fill="#5B6078" text-anchor="middle"><tspan x="150" dy="0.0">Docente = product owner</tspan></text><line x1="262" y1="330" x2="320" y2="330" stroke="#5B6078" stroke-width="4" marker-end="url(#ar)"/><rect x="330" y="270" width="170" height="120" rx="16" fill="#F2A93B" filter="url(#sh)"/><text x="415" y="312" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="415" dy="0.0">Planificación</tspan></text><text x="415" y="340" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="415" dy="0.0">Tareas, reparto y</tspan><tspan x="415" dy="15.6">definición de diversión</tspan></text><line x1="500" y1="330" x2="560" y2="330" stroke="#5B6078" stroke-width="4" marker-end="url(#ar)"/><circle cx="680" cy="330" r="120" fill="#fff" stroke="#14A38B" stroke-width="10" filter="url(#sh)"/><path d="M706 202 a34 34 0 1 0 -52 0" stroke="#3B82F6" stroke-width="6" fill="none"/><path d="M646 196 l8 10 l6 -12z" fill="#3B82F6"/><text x="680" y="112" font-size="15" font-weight="800" fill="#3B82F6" text-anchor="middle"><tspan x="680" dy="0.0">Stand-up al inicio de cada clase</tspan></text><text x="680" y="131" font-size="12" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="680" dy="0.0">¿Qué hice? ¿Qué haré? ¿Qué me frena?</tspan></text><text x="680" y="300" font-size="24" font-weight="800" fill="#14A38B" text-anchor="middle"><tspan x="680" dy="0.0">SPRINT</tspan></text><text x="680" y="330" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="680" dy="0.0">2 a 4 semanas · una unidad</tspan></text><g transform="translate(680,390) scale(1.0)"><rect x="-32" y="-26" width="64" height="48" rx="4" fill="#fff" stroke="#14A38B" stroke-width="3"/><line x1="-11" y1="-26" x2="-11" y2="22" stroke="#14A38B" stroke-width="1.5"/><line x1="10" y1="-26" x2="10" y2="22" stroke="#14A38B" stroke-width="1.5"/><rect x="-27" y="-20" width="13" height="10" fill="#F2A93B"/><rect x="-27" y="-6" width="13" height="10" fill="#F2A93B"/><rect x="-6" y="-20" width="13" height="10" fill="#3B82F6"/><rect x="15" y="-20" width="13" height="10" fill="#2E9E5B"/><rect x="15" y="-6" width="13" height="10" fill="#2E9E5B"/><rect x="15" y="8" width="13" height="10" fill="#2E9E5B"/></g><line x1="800" y1="330" x2="850" y2="330" stroke="#5B6078" stroke-width="4" marker-end="url(#ar)"/><rect x="860" y="200" width="200" height="110" rx="16" fill="#E5645A" filter="url(#sh)"/><text x="960" y="240" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="960" dy="0.0">Revisión</tspan></text><text x="960" y="268" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="960" dy="0.0">Se muestra lo aprendido</tspan><tspan x="960" dy="15.6">y se evalúa</tspan></text><rect x="860" y="350" width="200" height="110" rx="16" fill="#9B5DE5" filter="url(#sh)"/><text x="960" y="390" font-size="17" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="960" dy="0.0">Retrospectiva</tspan></text><text x="960" y="418" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="960" dy="0.0">¿Cómo hemos trabajado?</tspan><tspan x="960" dy="15.6">¿Qué mejoramos?</tspan></text><path d="M960 470 Q960 600 680 600 Q420 600 415 400" stroke="#5B6078" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#ar)"/><text x="680" y="625" font-size="14" font-weight="700" fill="#5B6078" text-anchor="middle"><tspan x="680" dy="0.0">Siguiente sprint</tspan></text><g transform="translate(330,520) scale(1.0)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#5B3FBF"/></g><text x="330" y="560" font-size="12" font-weight="700" fill="#5B3FBF" text-anchor="middle"><tspan x="330" dy="0.0">Docente</tspan></text><g transform="translate(420,520) scale(1.0)"><circle cx="0" cy="-34" r="14" fill="#F5C9A8"/><path d="M-20 0 Q-20 -18 0 -18 Q20 -18 20 0 L20 14 L-20 14 Z" fill="#14A38B"/></g><text x="420" y="560" font-size="12" font-weight="700" fill="#14A38B" text-anchor="middle"><tspan x="420" dy="0.0">eduScrum master</tspan></text>
</svg>
