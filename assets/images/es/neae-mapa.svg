<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="Alumnado con necesidad específica de apoyo educativo (NEAE)" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title>Alumnado con necesidad específica de apoyo educativo (NEAE)</title>
<defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1F2340" flood-opacity=".14"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6078"/></marker></defs>
<rect width="1100" height="700" rx="22" fill="#F6F4FD"/>
<text x="550.0" y="52" font-size="30" font-weight="800" fill="#1F2340" text-anchor="middle"><tspan x="550.0" dy="0.0">Alumnado con necesidad específica de apoyo educativo (NEAE)</tspan></text><text x="550.0" y="82" font-size="16" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550.0" dy="0.0">Las NEE son una parte de las NEAE (LOE, art. 71)</tspan></text><circle cx="550" cy="400" r="270" fill="#EDE9FB" stroke="#5B3FBF" stroke-width="3" stroke-dasharray="10 8"/><rect x="490" y="108" width="120" height="36" rx="18" fill="#5B3FBF"/><text x="550" y="133" font-size="18" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="550" dy="0.0">NEAE</tspan></text><circle cx="550" cy="400" r="92" fill="#5B3FBF" filter="url(#sh)"/><text x="550" y="382" font-size="22" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="550" dy="0.0">NEE</tspan></text><text x="550" y="410" font-size="12.5" font-weight="400" fill="#E9E6FA" text-anchor="middle"><tspan x="550" dy="0.0">Discapacidad o trastornos</tspan><tspan x="550" dy="15.6">graves de conducta,</tspan><tspan x="550" dy="15.6">comunicación o lenguaje</tspan></text><circle cx="619" cy="228" r="62" fill="#14A38B" filter="url(#sh)"/><text x="619.3022197819437" y="225.47098690514431" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="619.3022197819437" dy="0.0">Altas</tspan><tspan x="619.3022197819437" dy="16.2">capacidades</tspan></text><circle cx="720" cy="328" r="62" fill="#F2A93B" filter="url(#sh)"/><text x="720.2933978887015" y="316.71474122948433" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="720.2933978887015" dy="0.0">Trastornos de</tspan><tspan x="720.2933978887015" dy="16.2">atención o</tspan><tspan x="720.2933978887015" dy="16.2">aprendizaje</tspan></text><circle cx="722" cy="469" r="62" fill="#E5645A" filter="url(#sh)"/><text x="721.5290130948557" y="466.30221978194373" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="721.5290130948557" dy="0.0">Retraso</tspan><tspan x="721.5290130948557" dy="16.2">madurativo</tspan></text><circle cx="622" cy="570" r="62" fill="#3B82F6" filter="url(#sh)"/><text x="622.2852587705156" y="559.2933978887015" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="622.2852587705156" dy="0.0">Trastornos del</tspan><tspan x="622.2852587705156" dy="16.2">lenguaje y la</tspan><tspan x="622.2852587705156" dy="16.2">comunicación</tspan></text><circle cx="481" cy="572" r="62" fill="#9B5DE5" filter="url(#sh)"/><text x="480.69778021805627" y="560.5290130948557" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="480.69778021805627" dy="0.0">Desconocimiento</tspan><tspan x="480.69778021805627" dy="16.2">grave de la</tspan><tspan x="480.69778021805627" dy="16.2">lengua</tspan></text><circle cx="380" cy="472" r="62" fill="#2E9E5B" filter="url(#sh)"/><text x="379.70660211129854" y="469.28525877051567" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="379.70660211129854" dy="0.0">Vulnerabilidad</tspan><tspan x="379.70660211129854" dy="16.2">socioeducativa</tspan></text><circle cx="378" cy="331" r="62" fill="#D9822B" filter="url(#sh)"/><text x="378.4709869051443" y="327.69778021805627" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="378.4709869051443" dy="0.0">Incorporación</tspan><tspan x="378.4709869051443" dy="16.2">tardía</tspan></text><circle cx="478" cy="230" r="62" fill="#C2417A" filter="url(#sh)"/><text x="477.71474122948433" y="218.70660211129857" font-size="13" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="477.71474122948433" dy="0.0">Condiciones</tspan><tspan x="477.71474122948433" dy="16.2">personales o</tspan><tspan x="477.71474122948433" dy="16.2">de historia escolar</tspan></text><text x="550" y="690" font-size="13" font-weight="400" fill="#5B6078" text-anchor="middle"><tspan x="550" dy="0.0">Toda persona con NEE tiene NEAE, pero no al revés.</tspan></text>
</svg>
